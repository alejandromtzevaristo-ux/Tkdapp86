kind = "web"
previewPath = "/"
title = "App TKD"
description = "Aplicación web progresiva en español para administrar una escuela de Taekwondo: alumnos, asistencia con credenciales QR, pagos, inventario, ventas y operación offline, conectada con Firebase."
version = "1.0.0"
id = "artifacts/app-tkd"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18276

[services.development]
run = "pnpm --filter @workspace/app-tkd run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/app-tkd", "run", "build" ]
serve = "static"
publicDir = "artifacts/app-tkd/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18276"
BASE_PATH = "/"
